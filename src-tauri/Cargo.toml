[package]
name = "nexus"
version = "0.1.0"
description = "NEXUS — macOS intelligence and optimization platform"
edition = "2021"
rust-version = "1.85"

[lib]
name = "nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
rayon = "1.12"
rusqlite = { version = "0.41", features = ["bundled"] }
sysinfo = "0.40"
blake3 = { version = "1.8", features = ["rayon"] }
trash = "5.2"
plist = "1.10"
libc = "0.2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
core-foundation = "0.10"
io-kit-sys = "0.5"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString", "NSData", "NSDictionary"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSImage", "NSBitmapImageRep", "NSImageRep"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
